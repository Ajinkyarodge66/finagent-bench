[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-bench"
version = "0.2.0"
description = "Benchmark for tool-using LLM agents on financial documents: accuracy and prompt-injection robustness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest"]

[tool.setuptools]
packages = ["finagent_bench"]
